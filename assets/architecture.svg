<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">Certificate taxonomy</title>
  <desc id="d">21 certificates from 3 issuers, grouped into 6 domains.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .sec { fill: #8b949e; font-size: 12px; }
    .name { font-size: 14px; font-weight: 600; }
    .num { font-size: 12px; font-weight: 600; }
    .node { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .issuer { stroke: #58a6ff; }
    .count { stroke: #3fb950; }
    .rail { fill: none; stroke: #30363d; stroke-width: 1.5; }
    .pulse { fill: none; stroke-width: 2.5; stroke-linecap: square; stroke-dasharray: 12 300; animation: flow 3.6s linear infinite; }
    .blue { stroke: #58a6ff; }
    .green { stroke: #3fb950; }
    @keyframes flow { from { stroke-dashoffset: 12; } to { stroke-dashoffset: -100; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; stroke-dasharray: none; opacity: 0.45; }
    }
  </style>
  <rect width="960" height="540" fill="#0d1117"/>
