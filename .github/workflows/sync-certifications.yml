name: Sync certifications

# Regenerates the README tables, the JSON index and the taxonomy diagram from the
# certificate files. The parser is deterministic and calls no external service.

on:
  schedule:
    - cron: '40 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-certifications
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GENERATED: README.md docs/certificates-index.json assets/architecture.svg
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Regenerate README, index and diagram
        run: python scripts/sync_certificates.py

      - name: Verify the output is stable
        run: python scripts/sync_certificates.py --check

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          if git diff --quiet -- $GENERATED; then
            echo "No changes."
            exit 0
          fi
          total="$(python -c "import json; print(json.load(open('docs/certificates-index.json', encoding='utf-8'))['summary']['total'])")"
          git config user.name "MD Tarek Islam"
          git config user.email "md.tarek.mlearn@gmail.com"
          # shellcheck disable=SC2086
          git add -- $GENERATED
          git commit -m "chore(certs): sync README index (${total} certificates)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected, rebasing (attempt ${attempt})."
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
